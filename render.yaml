# Сайт для менеджеров (web/) на бесплатном тарифе Render.
# Telegram-бот здесь не запускается — он работает отдельно (GitHub Actions).
services:
  - type: web
    name: creatica-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m web.server
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: WEB_SECRET
        generateValue: true
      - key: PRIVATE_BUNDLE_B64  # тот же архив, что секрет бота на GitHub
        sync: false
